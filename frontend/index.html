<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Trello</title>
  <meta name="description" content="Mini-Trello: create tasks and move them across To Do, In Progress and Done.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo" aria-label="Mini-Trello Logo">
        <div class="logo-mark" aria-hidden="true">
          <svg class="logo-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M20 12h18c4.418 0 8 3.582 8 8v28c0 4.418-3.582 8-8 8H20c-4.418 0-8-3.582-8-8V20c0-4.418 3.582-8 8-8z" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M24 18h16M24 28h16M24 38h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M19 34l8 8 18-22" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">Mini-</span>
          <span class="logo-title logo-title-plain">Trello</span>
        </div>
      </div>

      <div class="header-right">
        <div class="overall-wrap">
          <div class="overall-top">
            <span class="label">Overall progress</span>
            <span class="progress-percentage">0 / 0 tasks</span>
          </div>
          <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" style="width: 0%"><span>0%</span></div>
          </div>
        </div>

        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off">
        </div>

        <div class="toggle-group" role="tablist">
          <button class="toggle-btn active" data-view="board" role="tab">Board</button>
          <button class="toggle-btn" data-view="table" role="tab">Table</button>
        </div>

        <button class="cta-button">+ Create New Task</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- Board view -->
    <div class="columns" id="board-view">
      <section class="column todo" data-status="todo">
        <div class="column-header">
          <div class="column-title">
            <span class="dot dot-todo"></span>
            <span>TO DO</span>
            <span class="task-count">0</span>
          </div>
        </div>
        <p class="column-desc">Tasks to start</p>
        <div class="column-tasks" id="todo-column"></div>
      </section>

      <section class="column in-progress" data-status="in_progress">
        <div class="column-header">
          <div class="column-title">
            <span class="dot dot-progress"></span>
            <span>IN PROGRESS</span>
            <span class="task-count">0</span>
          </div>
        </div>
        <p class="column-desc">Currently working on</p>
        <div class="column-tasks" id="in-progress-column"></div>
      </section>

      <section class="column done" data-status="done">
        <div class="column-header">
          <div class="column-title">
            <span class="dot dot-done"></span>
            <span>DONE</span>
            <span class="task-count">0</span>
          </div>
        </div>
        <p class="column-desc">Completed work</p>
        <div class="column-tasks" id="done-column"></div>
      </section>
    </div>

    <!-- Table view -->
    <div class="table-wrap" id="table-view" hidden>
      <table class="task-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Progress</th>
            <th>Assigned</th>
            <th>Due</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty-table" id="empty-table" hidden>No tasks found. Create your first task!</div>
    </div>
  </main>

  <!-- Create / Edit Task Modal -->
  <div class="modal" id="task-modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Create New Task</h2>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <p class="modal-sub">Add details below. Title and description are required.</p>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label for="task-title">Title *</label>
          <input type="text" id="task-title" placeholder="e.g. Design database schema" required maxlength="120">
        </div>
        <div class="form-group">
          <label for="task-description">Description *</label>
          <textarea id="task-description" placeholder="What needs to be done?" required rows="3" maxlength="1000"></textarea>
        </div>
        <div class="form-group">
          <label for="task-created-by">Created By *</label>
          <input type="text" id="task-created-by" placeholder="e.g. Your Name" required maxlength="60">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="modal-submit" id="modal-submit">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
